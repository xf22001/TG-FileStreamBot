name: Manual Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for the build (e.g., v1.0.0)'
        required: true
        default: 'manual'
  push:
    branches:
      - '*'
    tags-ignore:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Before Build Hooks
        run: |
          go mod tidy
          go generate ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=fsb
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=fsb.exe
          fi
          # 参数对齐 Goreleaser: -tags=musl, -extldflags -static, -s -w
          go build -o "$BINARY_NAME" -tags=musl -ldflags="-extldflags -static -s -w" ./cmd/fsb

      - name: Package
        run: |
          # 自动获取标识符: 优先使用输入 Tag，push 触发则使用短哈希
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(git rev-parse --short HEAD)
          fi
          
          PACKAGE_NAME=TG-FileStreamBot-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir -p upload
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "upload/${PACKAGE_NAME}.zip" fsb.exe README.md LICENSE
          else
            tar -czvf "upload/${PACKAGE_NAME}.tar.gz" fsb README.md LICENSE
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7
