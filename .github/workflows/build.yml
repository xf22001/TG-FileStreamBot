name: Manual Build

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Optional build identifier'
        required: false
        default: 'dev'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Before Build Hooks
        run: |
          go mod tidy
          go generate ./...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME=fsb
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=fsb.exe
          fi
          # 完全一致的 release 编译参数
          go build -o "$BINARY_NAME" -tags=musl -ldflags="-extldflags -static -s -w" ./cmd/fsb

      - name: Prepare Package
        run: |
          # 仅使用标识符区分，不打 tag
          ID="${{ github.event.inputs.build_name }}"
          if [ -z "$ID" ]; then
            ID=$(git rev-parse --short HEAD)
          fi
          
          PACKAGE_DIR="upload"
          mkdir -p "$PACKAGE_DIR"
          
          # 压缩包名称
          FILENAME="fsb-${ID}-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j "${PACKAGE_DIR}/${FILENAME}.zip" fsb.exe README.md LICENSE
          else
            tar -czvf "${PACKAGE_DIR}/${FILENAME}.tar.gz" fsb README.md LICENSE
          fi

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: upload/*
          retention-days: 7
